<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>一根线，四个信号</title><desc>断电连接，核对线色与接口定义；此图是电气对应关系，不表示插头观察方向。</desc><g font-family="PingFang SC, Noto Sans SC, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f7f5ee"/><text x="64" y="60" font-size="20" fill="#246e58">MUSIC MAGICIAN / 安装图解</text><text x="64" y="140" font-size="48" fill="#163d37">一根线，四个信号</text><text x="64" y="190" font-size="24" fill="#61766f">断电连接，核对线色与接口定义；此图是电气对应关系，不表示插头观察方向。</text><rect x="64" y="250" width="390" height="445" rx="20" fill="#ffffff"/><rect x="986" y="250" width="390" height="445" rx="20" fill="#ffffff"/><text x="94" y="302" font-size="32" fill="#163d37">AtomS3R-CAM</text><text x="1016" y="302" font-size="32" fill="#163d37">U059</text><text x="94" y="370" font-size="27" fill="#163d37">GND / 黑</text><path d="M425 362 L1005 362" stroke="#26352f" stroke-width="6" fill="none"/><text x="1040" y="370" font-size="26" fill="#163d37">黑 / GND</text><text x="94" y="445" font-size="27" fill="#163d37">5V / 红</text><path d="M425 437 L1005 437" stroke="#bd542e" stroke-width="6" fill="none"/><text x="1040" y="445" font-size="26" fill="#163d37">红 / 5V</text><text x="94" y="520" font-size="27" fill="#163d37">GPIO2 / 黄</text><path d="M425 512 L1005 512" stroke="#ac8614" stroke-width="6" fill="none"/><text x="1040" y="520" font-size="26" fill="#163d37">黄 / DIN</text><text x="94" y="595" font-size="27" fill="#163d37">GPIO1 / 白</text><path d="M425 587 L1005 587" stroke="#8f9e98" stroke-width="6" fill="none"/><text x="1040" y="595" font-size="26" fill="#163d37">白 / NC</text><text x="540" y="500" font-size="25" fill="#163d37">G2 输出 PWM · 10 kHz</text><text x="534" y="637" font-size="21" fill="#61766f">白线在 U059 端不连接电路</text><text x="88" y="745" font-size="26" fill="#bd542e">固件环境必须选 m5atoms3r_cam_u059；默认 CAM 环境把振动输出放在 G1。</text><path d="M64 826 L1376 826" stroke="#d9ded4" stroke-width="2" fill="none"/><text x="64" y="866" font-size="19" fill="#61766f">代码与编译已验证 · 硬件尚未实测 · 接线按信号名称核对，示意图不代表实物比例</text><text x="1280" y="866" font-size="20" fill="#246e58">03 / 06</text></g></svg>