<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>安装是六步，还不是一键</title><desc>接线简单的 U059 路线，也需要一次开发工具安装、编译和上传。</desc><g font-family="PingFang SC, Noto Sans SC, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f7f5ee"/><text x="64" y="60" font-size="20" fill="#246e58">MUSIC MAGICIAN / 安装图解</text><text x="64" y="140" font-size="48" fill="#163d37">安装是六步，还不是一键</text><text x="64" y="190" font-size="24" fill="#61766f">接线简单的 U059 路线，也需要一次开发工具安装、编译和上传。</text><rect x="64" y="245" width="424" height="180" rx="20" fill="#ffffff"/><text x="88" y="287" font-size="27" fill="#163d37">01 / 确认与准备</text><text x="88" y="327" font-size="21" fill="#61766f">确定板名和振动模块</text><text x="88" y="359" font-size="21" fill="#61766f">记录原固件恢复方式</text><rect x="508" y="245" width="424" height="180" rx="20" fill="#ffffff"/><text x="532" y="287" font-size="27" fill="#163d37">02 / 安装工具</text><text x="532" y="327" font-size="21" fill="#61766f">克隆仓库，安装 PlatformIO</text><text x="532" y="359" font-size="21" fill="#61766f">第一次编译需联网下载依赖</text><rect x="952" y="245" width="424" height="180" rx="20" fill="#ffffff"/><text x="976" y="287" font-size="27" fill="#163d37">03 / 选择环境</text><text x="976" y="327" font-size="21" fill="#61766f">U059 选 CAM 的 U059 环境</text><text x="976" y="359" font-size="21" fill="#61766f">构建成功，再进行烧录</text><rect x="64" y="481" width="424" height="180" rx="20" fill="#ffffff"/><text x="88" y="523" font-size="27" fill="#163d37">04 / 找到串口</text><text x="88" y="563" font-size="21" fill="#61766f">pio device list</text><text x="88" y="595" font-size="21" fill="#61766f">选择你已确认的设备端口</text><rect x="508" y="481" width="424" height="180" rx="20" fill="#ffffff"/><text x="532" y="523" font-size="27" fill="#163d37">05 / 烧录程序</text><text x="532" y="563" font-size="21" fill="#61766f">pio run … -t upload</text><text x="532" y="595" font-size="21" fill="#61766f">会替换当前 Chatbot 应用</text><rect x="952" y="481" width="424" height="180" rx="20" fill="#ffffff"/><text x="976" y="523" font-size="27" fill="#163d37">06 / 打开串口</text><text x="976" y="563" font-size="21" fill="#61766f">115200 波特率；发送换行</text><text x="976" y="595" font-size="21" fill="#61766f">list → play hello → stop</text><text x="88" y="754" font-size="25" fill="#61766f">完整可复制命令见配套文档。当前没有自动选板、网页一键烧录或手机配置应用。</text><path d="M64 826 L1376 826" stroke="#d9ded4" stroke-width="2" fill="none"/><text x="64" y="866" font-size="19" fill="#61766f">代码与编译已验证 · 硬件尚未实测 · 接线按信号名称核对，示意图不代表实物比例</text><text x="1280" y="866" font-size="20" fill="#246e58">05 / 06</text></g></svg>