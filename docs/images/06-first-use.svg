<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>把一句“你好”，写成触感</title><desc>先验证串口，再验证动作；拔电或 stop / disarm 后，需要重新 arm 才能摇动触发。</desc><g font-family="PingFang SC, Noto Sans SC, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f7f5ee"/><text x="64" y="60" font-size="20" fill="#246e58">MUSIC MAGICIAN / 安装图解</text><text x="64" y="140" font-size="48" fill="#163d37">把一句“你好”，写成触感</text><text x="64" y="190" font-size="24" fill="#61766f">先验证串口，再验证动作；拔电或 stop / disarm 后，需要重新 arm 才能摇动触发。</text><rect x="64" y="245" width="410" height="180" rx="20" fill="#ffffff"/><text x="88" y="287" font-size="27" fill="#163d37">先确认输出</text><text x="88" y="327" font-size="21" fill="#61766f">串口发送：play hello</text><text x="88" y="359" font-size="21" fill="#61766f">马达应播放“短—停—短”</text><text x="88" y="391" font-size="21" fill="#61766f">stop：PWM 归零，动作检测关闭</text><rect x="494" y="245" width="422" height="180" rx="20" fill="#ffffff"/><text x="518" y="287" font-size="27" fill="#163d37">再启用摇动</text><text x="518" y="327" font-size="21" fill="#61766f">发送 arm，放稳至少 2 秒</text><text x="518" y="359" font-size="21" fill="#61766f">等到 motion armed，再来回摇动</text><text x="518" y="391" font-size="21" fill="#61766f">双峰触发；不是打响指识别</text><rect x="936" y="245" width="440" height="180" rx="20" fill="#ffffff"/><text x="960" y="287" font-size="27" fill="#163d37">最后写自己的触感</text><text x="960" y="327" font-size="21" fill="#61766f">编辑 config/patterns.json</text><text x="960" y="359" font-size="21" fill="#61766f">每段：[毫秒, PWM 数值]</text><text x="960" y="391" font-size="21" fill="#61766f">保存 → 重新编译 → 重新烧录</text><text x="88" y="495" font-size="34" fill="#163d37">hello</text><text x="250" y="495" font-size="30" fill="#163d37">[[90, 180], [100, 0], [90, 180]]</text><rect x="250" y="550" width="270" height="105" rx="8" fill="#246e58"/><path d="M520 655 L820 655" stroke="#61766f" stroke-width="3" fill="none"/><rect x="820" y="550" width="270" height="105" rx="8" fill="#246e58"/><text x="315" y="600" font-size="25" fill="#ffffff">PWM 180</text><text x="575" y="610" font-size="25" fill="#163d37">PWM 0</text><text x="885" y="600" font-size="25" fill="#ffffff">PWM 180</text><text x="320" y="694" font-size="25" fill="#163d37">90 ms</text><text x="615" y="694" font-size="25" fill="#163d37">100 ms</text><text x="890" y="694" font-size="25" fill="#163d37">90 ms</text><text x="88" y="758" font-size="24" fill="#61766f">总时长 280 ms；PWM 不是实际体感强度。电机有惯性，指令波形不等于物理振动波形。</text><path d="M64 826 L1376 826" stroke="#d9ded4" stroke-width="2" fill="none"/><text x="64" y="866" font-size="19" fill="#61766f">代码与编译已验证 · 硬件尚未实测 · 接线按信号名称核对，示意图不代表实物比例</text><text x="1280" y="866" font-size="20" fill="#246e58">06 / 06</text></g></svg>