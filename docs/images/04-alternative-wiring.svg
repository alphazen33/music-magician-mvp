<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>需要 NFC 时，再加读卡器</title><desc>这是经典 ESP32-WROOM 的接线；不能直接套到 AtomS3R-CAM、C3 或其他 S3。</desc><g font-family="PingFang SC, Noto Sans SC, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f7f5ee"/><text x="64" y="60" font-size="20" fill="#246e58">MUSIC MAGICIAN / 安装图解</text><text x="64" y="140" font-size="48" fill="#163d37">需要 NFC 时，再加读卡器</text><text x="64" y="190" font-size="24" fill="#61766f">这是经典 ESP32-WROOM 的接线；不能直接套到 AtomS3R-CAM、C3 或其他 S3。</text><rect x="64" y="235" width="410" height="180" rx="20" fill="#ffffff"/><text x="88" y="277" font-size="27" fill="#163d37">CAM + 独立 ERM 驱动</text><text x="88" y="317" font-size="21" fill="#61766f">环境：m5atoms3r_cam</text><text x="88" y="349" font-size="21" fill="#61766f">GPIO1 → 驱动逻辑输入</text><text x="88" y="381" font-size="21" fill="#61766f">可选按钮：GPIO2 ↔ GND</text><rect x="494" y="235" width="422" height="180" rx="20" fill="#ffffff"/><text x="518" y="277" font-size="27" fill="#163d37">经典 ESP32 + 独立驱动</text><text x="518" y="317" font-size="21" fill="#61766f">环境：esp32dev</text><text x="518" y="349" font-size="21" fill="#61766f">GPIO25 → 驱动逻辑输入</text><text x="518" y="381" font-size="21" fill="#61766f">可选按钮：GPIO32 ↔ GND</text><rect x="936" y="235" width="440" height="180" rx="20" fill="#ffffff"/><text x="960" y="277" font-size="27" fill="#163d37">3V ERM 的电源路径</text><text x="960" y="317" font-size="21" fill="#61766f">稳压 3V → 驱动 / 马达电源</text><text x="960" y="349" font-size="21" fill="#61766f">驱动必须兼容 3.3V 逻辑</text><text x="960" y="381" font-size="21" fill="#61766f">电源地、驱动地、主控地共地</text><rect x="64" y="445" width="810" height="325" rx="20" fill="#ffffff"/><text x="88" y="485" font-size="29" fill="#163d37">经典 ESP32-WROOM → PN532（SPI）</text><text x="88" y="540" font-size="25" fill="#163d37">GPIO18 → SCK</text><text x="475" y="540" font-size="25" fill="#163d37">GPIO19 → MISO</text><text x="88" y="590" font-size="25" fill="#163d37">GPIO23 → MOSI</text><text x="475" y="590" font-size="25" fill="#163d37">GPIO27 → SSEL / CS</text><text x="88" y="640" font-size="25" fill="#163d37">3V3 → 3.3Vin*</text><text x="475" y="640" font-size="25" fill="#163d37">GND → GND</text><text x="88" y="733" font-size="19" fill="#61766f">* 仅用于支持此供电与 3.3V 逻辑的模块；按模块手册切换 SPI。</text><rect x="896" y="445" width="480" height="325" rx="20" fill="#f3e2d5"/><text x="920" y="485" font-size="29" fill="#bd542e">三个接线边界</text><text x="920" y="545" font-size="23" fill="#163d37">马达不能直接接 GPIO</text><text x="920" y="594" font-size="23" fill="#163d37">5V 不能直接供给 3V 马达</text><text x="920" y="643" font-size="23" fill="#163d37">此驱动路径不支持 LRA</text><text x="920" y="692" font-size="23" fill="#163d37">完整 MOSFET 电路见 WIRING.md</text><path d="M64 826 L1376 826" stroke="#d9ded4" stroke-width="2" fill="none"/><text x="64" y="866" font-size="19" fill="#61766f">代码与编译已验证 · 硬件尚未实测 · 接线按信号名称核对，示意图不代表实物比例</text><text x="1280" y="866" font-size="20" fill="#246e58">04 / 06</text></g></svg>