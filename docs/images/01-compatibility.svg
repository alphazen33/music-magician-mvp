<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>不是所有 ESP32 都能直接刷</title><desc>先确认完整板名，再选择环境；esp32dev 不是整个 ESP32 家族的通用配置。</desc><g font-family="PingFang SC, Noto Sans SC, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f7f5ee"/><text x="64" y="60" font-size="20" fill="#246e58">MUSIC MAGICIAN / 安装图解</text><text x="64" y="140" font-size="48" fill="#163d37">不是所有 ESP32 都能直接刷</text><text x="64" y="190" font-size="24" fill="#61766f">先确认完整板名，再选择环境；esp32dev 不是整个 ESP32 家族的通用配置。</text><rect x="64" y="245" width="636" height="180" rx="20" fill="#ffffff"/><text x="88" y="287" font-size="27" fill="#163d37">AtomS3R-CAM / 已有两种配置</text><text x="88" y="327" font-size="21" fill="#61766f">m5atoms3r_cam：G1 → 独立驱动</text><text x="88" y="359" font-size="21" fill="#61766f">m5atoms3r_cam_u059：G2 → U059</text><text x="88" y="391" font-size="21" fill="#61766f">两种配置均有串口、按钮、可启用的摇动检测</text><rect x="724" y="245" width="652" height="180" rx="20" fill="#ffffff"/><text x="748" y="287" font-size="27" fill="#163d37">经典 ESP32-WROOM / 已有配置</text><text x="748" y="327" font-size="21" fill="#61766f">esp32dev：PN532 → 标签触发</text><text x="748" y="359" font-size="21" fill="#61766f">串口、外接按钮 → G25 振动输出</text><text x="748" y="391" font-size="21" fill="#61766f">当前配置没有板载 IMU 摇动功能</text><rect x="64" y="450" width="636" height="180" rx="20" fill="#ffffff"/><text x="88" y="492" font-size="27" fill="#163d37">其他 S3 / C3 / C6 / S2 / …</text><text x="88" y="532" font-size="21" fill="#61766f">不能直接套用现有固件或接线</text><text x="88" y="564" font-size="21" fill="#61766f">需核对芯片、Flash、PSRAM、USB、GPIO</text><text x="88" y="596" font-size="21" fill="#61766f">传感器与 Arduino / PlatformIO 支持也需适配</text><rect x="724" y="450" width="652" height="180" rx="20" fill="#ffffff"/><text x="748" y="492" font-size="27" fill="#163d37">Seeed reSpeaker / 待明确型号</text><text x="748" y="532" font-size="21" fill="#61766f">同一个产品家族可能采用不同主控</text><text x="748" y="564" font-size="21" fill="#61766f">尚未适配，不建议直接刷入本仓库固件</text><text x="748" y="596" font-size="21" fill="#61766f">原有语音与 Chatbot 程序不在本次功能内</text><rect x="64" y="660" width="1312" height="104" rx="20" fill="#e4eddf"/><text x="90" y="705" font-size="30" fill="#163d37">可移植的是控制逻辑；固件、引脚和传感器适配要按具体开发板选择。</text><text x="90" y="740" font-size="22" fill="#61766f">“本地编译通过”尚不代表“每块板都已连接测试”。</text><path d="M64 826 L1376 826" stroke="#d9ded4" stroke-width="2" fill="none"/><text x="64" y="866" font-size="19" fill="#61766f">代码与编译已验证 · 硬件尚未实测 · 接线按信号名称核对，示意图不代表实物比例</text><text x="1280" y="866" font-size="20" fill="#246e58">01 / 06</text></g></svg>