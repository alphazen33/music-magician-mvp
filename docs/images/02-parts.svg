<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>先搭出最短的一次振动</title><desc>推荐路线：你的 AtomS3R-CAM + U059；不需要焊接裸马达驱动电路。</desc><g font-family="PingFang SC, Noto Sans SC, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f7f5ee"/><text x="64" y="60" font-size="20" fill="#246e58">MUSIC MAGICIAN / 安装图解</text><text x="64" y="140" font-size="48" fill="#163d37">先搭出最短的一次振动</text><text x="64" y="190" font-size="24" fill="#61766f">推荐路线：你的 AtomS3R-CAM + U059；不需要焊接裸马达驱动电路。</text><rect x="64" y="245" width="410" height="180" rx="20" fill="#ffffff"/><text x="88" y="287" font-size="27" fill="#163d37">01 / 你已有的主机</text><text x="88" y="327" font-size="21" fill="#61766f">AtomS3R-CAM AI Chatbot</text><text x="88" y="359" font-size="21" fill="#61766f">本项目只使用 CAM 控制器</text><text x="88" y="391" font-size="21" fill="#61766f">相机、语音与联网未启用</text><rect x="494" y="245" width="422" height="180" rx="20" fill="#ffffff"/><text x="518" y="287" font-size="27" fill="#163d37">02 / 增加振动输出</text><text x="518" y="327" font-size="21" fill="#61766f">M5 Unit Vibrator U059</text><text x="518" y="359" font-size="21" fill="#61766f">内置马达与 MOSFET 驱动</text><text x="518" y="391" font-size="21" fill="#61766f">配套 Grove HY2.0 4P 线</text><rect x="936" y="245" width="440" height="180" rx="20" fill="#ffffff"/><text x="960" y="287" font-size="27" fill="#163d37">03 / 电脑与连接</text><text x="960" y="327" font-size="21" fill="#61766f">USB-C 数据线 + 电脑</text><text x="960" y="359" font-size="21" fill="#61766f">Python + PlatformIO</text><text x="960" y="391" font-size="21" fill="#61766f">核对 5V 供电能力</text><text x="84" y="510" font-size="36" fill="#163d37">电脑</text><path d="M205 500 L470 500" stroke="#246e58" stroke-width="4" fill="none"/><text x="270" y="480" font-size="19" fill="#163d37">USB 数据 / 供电</text><text x="500" y="510" font-size="36" fill="#163d37">CAM</text><path d="M625 500 L975 500" stroke="#246e58" stroke-width="4" fill="none"/><text x="720" y="480" font-size="19" fill="#163d37">Grove 4P</text><text x="1020" y="510" font-size="36" fill="#163d37">U059</text><rect x="64" y="566" width="1312" height="199" rx="20" fill="#e4eddf"/><text x="90" y="615" font-size="30" fill="#163d37">这是最省接线的现有方案：不需要 NFC、不需要额外按钮。</text><text x="90" y="661" font-size="25" fill="#163d37">先用串口 play hello 验证输出，再用 arm 启用板载摇动输入。</text><text x="90" y="708" font-size="23" fill="#61766f">U059 官方 50% PWM 工况：5V / 424.35mA；这不是整机峰值或电源选型上限。</text><path d="M64 826 L1376 826" stroke="#d9ded4" stroke-width="2" fill="none"/><text x="64" y="866" font-size="19" fill="#61766f">代码与编译已验证 · 硬件尚未实测 · 接线按信号名称核对，示意图不代表实物比例</text><text x="1280" y="866" font-size="20" fill="#246e58">02 / 06</text></g></svg>