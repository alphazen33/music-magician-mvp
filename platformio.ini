[platformio]
default_envs = m5atoms3r_cam

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/pio_generate.py

[env:m5atoms3r_cam]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
lib_deps =
  m5stack/M5GFX@0.2.29
  m5stack/M5Unified@0.2.7
build_flags =
  -Iinclude
  -DHAPTIC_ATOMS3R_CAM=1
  -DHAPTIC_NFC=0
  -DHAPTIC_IMU=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:esp32dev]
board = esp32dev
lib_deps =
  adafruit/Adafruit PN532@1.3.4
  adafruit/Adafruit BusIO@1.17.0
build_flags = -Iinclude -DHAPTIC_NFC=1

[env:m5atoms3r_cam_u059]
extends = env:m5atoms3r_cam
build_flags =
  ${env:m5atoms3r_cam.build_flags}
  -DHAPTIC_U059=1
